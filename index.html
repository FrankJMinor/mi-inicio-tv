<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Inicio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
  /* Layout: full-bleed dark "stage" — top bar (greeting + live clock), two D-pad
     navigable rows (apps, accesos). Single dark theme by design (a TV launcher). */
  :root{
    --bg:#06070b;
    --bg-2:#0d0f16;
    --tile:#12141d;
    --fg:#f3f4f8;
    --muted:#888ea2;
    --line:rgba(255,255,255,.08);
    --focus:#ffc24b;
    --focus-glow:rgba(255,194,75,.45);
    --display:'Sora',system-ui,-apple-system,sans-serif;
    --ui:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(130% 90% at 80% -10%, #15131f 0%, transparent 55%),
      radial-gradient(120% 80% at 0% 110%, #0a1420 0%, transparent 50%),
      var(--bg);
    color:var(--fg);font-family:var(--ui);
    -webkit-font-smoothing:antialiased;
  }
  .stage{
    min-height:100%;display:flex;flex-direction:column;gap:clamp(18px,3.2vh,40px);
    padding:clamp(22px,4.2vh,52px) max(clamp(26px,4vw,64px),env(safe-area-inset-left,0px)) clamp(18px,3vh,36px) max(clamp(26px,4vw,64px),env(safe-area-inset-right,0px));
    box-sizing:border-box;
  }

  /* ---- top bar ---- */
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .greet h1{
    font-family:var(--display);font-weight:800;margin:0;
    font-size:clamp(1.9rem,4.4vw,3.3rem);letter-spacing:-.02em;text-wrap:balance;line-height:1.02;
  }
  .greet .name{color:var(--focus)}
  .greet p{margin:.5rem 0 0;color:var(--muted);font-size:clamp(.9rem,1.5vw,1.15rem);text-transform:capitalize}
  .clock{text-align:right;line-height:1}
  .clock .time{
    font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;
    font-size:clamp(2.1rem,5vw,3.6rem);letter-spacing:-.01em;
  }
  .clock .ampm{color:var(--muted);font-weight:600;font-size:.42em;margin-left:.35em}

  /* ---- rows ---- */
  main{display:flex;flex-direction:column;gap:clamp(16px,2.8vh,34px);flex:1}
  .rowlabel{
    font-size:.82rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:0 0 clamp(10px,1.4vh,16px);
  }
  .row{display:flex;gap:clamp(12px,1.4vw,22px);flex-wrap:wrap}

  .tile{
    position:relative;border:0;cursor:pointer;color:#fff;font-family:var(--ui);
    border-radius:18px;overflow:hidden;padding:0;
    outline:none;transition:transform .16s ease, box-shadow .16s ease;
    background:var(--tile);isolation:isolate;
  }
  .tile:focus-visible,.tile.is-focus{
    transform:translateY(-4px) scale(1.035);
    box-shadow:0 0 0 3px var(--focus), 0 14px 38px -10px var(--focus-glow);
    z-index:2;
  }
  @media (prefers-reduced-motion:reduce){.tile{transition:none}.tile.is-focus{transform:none}}

  /* app tiles */
  .apps .tile{width:clamp(150px,15.5vw,224px);aspect-ratio:16/10}
  .brand{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-weight:800;letter-spacing:-.01em}
  .tile .label{position:absolute;left:14px;bottom:11px;font-size:.84rem;font-weight:600;
    color:rgba(255,255,255,.92);text-shadow:0 1px 6px rgba(0,0,0,.5);z-index:3}

  /* brand looks */
  .b-netflix{background:#0b0b0f}
  .b-netflix .wm{font-family:var(--display);font-weight:800;color:#E50914;font-size:clamp(1.3rem,2.7vw,2rem);letter-spacing:.02em}
  .b-prime{background:linear-gradient(135deg,#0f1c30,#15304f)}
  .b-prime .wm{font-size:clamp(1.05rem,2.1vw,1.5rem);font-weight:700}
  .b-prime .wm b{color:#38b6ff}
  .b-disney{background:linear-gradient(150deg,#071249,#0a1f78 70%)}
  .b-disney .wm{font-family:var(--display);font-weight:700;font-size:clamp(1.15rem,2.4vw,1.8rem)}
  .b-disney .plus{color:#2ec8ff}
  .b-crunchy{background:#f47521}
  .b-crunchy .wm{color:#1a1a1a;font-weight:800;font-size:clamp(1rem,2vw,1.42rem);letter-spacing:-.02em}
  .b-vix{background:linear-gradient(120deg,#ff2d6f,#ff7a3d)}
  .b-vix .wm{font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(1.5rem,3vw,2.3rem)}
  .b-hbo{background:linear-gradient(135deg,#1a0b3a,#211253 55%,#0a1f66)}
  .b-hbo .wm{font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,2.5vw,1.9rem);letter-spacing:-.01em}
  .b-hbo .wm span{font-weight:500;opacity:.88;margin-left:.12em}

  /* quick tiles */
  .quick .tile{width:clamp(118px,11vw,164px);aspect-ratio:16/11;background:var(--bg-2);
    border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px}
  .quick .tile .ic{width:clamp(26px,2.4vw,34px);height:clamp(26px,2.4vw,34px);color:var(--fg)}
  .quick .tile .qlabel{font-size:.86rem;font-weight:600;color:var(--fg)}
  .quick .tile .ic.yt{color:#ff3d3d}
  .quick .tile.dim{opacity:.5}
  .quick .tile.dim .qlabel,.quick .tile.dim .ic{color:var(--muted)}

  .hint{color:var(--muted);font-size:.82rem;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .hint kbd{font-family:var(--ui);background:var(--bg-2);border:1px solid var(--line);
    border-radius:7px;padding:2px 9px;font-size:.8rem;color:var(--fg)}
  .tag{margin-left:auto;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px}

  .toast{position:fixed;left:50%;bottom:clamp(26px,6vh,64px);transform:translateX(-50%) translateY(12px);
    background:var(--focus);color:#20160b;font-weight:700;padding:13px 24px;border-radius:999px;
    box-shadow:0 14px 40px -12px var(--focus-glow);opacity:0;transition:opacity .2s,transform .2s;z-index:9}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:560px){
    .apps .tile{width:calc(50% - 8px)}
    .quick .tile{width:calc(33.333% - 8px)}
    .clock{text-align:left}
  }
</style>
</head>
<body style="margin:0">


<div class="stage">
  <header class="topbar">
    <div class="greet">
      <h1 id="greet">Buenas noches, <span class="name">Fredi</span></h1>
      <p id="dateline">lunes 26 de octubre</p>
    </div>
    <div class="clock"><span class="time" id="clock">--:--</span></div>
  </header>

  <main>
    <section>
      <h2 class="rowlabel">Tus apps</h2>
      <div class="row apps" id="apps">
        <button class="tile b-netflix" data-app="Netflix"><span class="brand"><span class="wm">NETFLIX</span></span></button>
        <button class="tile b-prime" data-app="Prime Video"><span class="brand"><span class="wm"><b>prime</b> video</span></span><span class="label">Prime Video</span></button>
        <button class="tile b-disney" data-app="Disney+"><span class="brand"><span class="wm">Disney<span class="plus">+</span></span></span></button>
        <button class="tile b-crunchy" data-app="Crunchyroll"><span class="brand"><span class="wm">crunchyroll</span></span><span class="label" style="color:#1a1a1a;text-shadow:none">Crunchyroll</span></button>
        <button class="tile b-vix" data-app="ViX"><span class="brand"><span class="wm">ViX</span></span></button>
        <button class="tile b-hbo" data-app="HBO Max"><span class="brand"><span class="wm">HBO<span>Max</span></span></span></button>
      </div>
    </section>

    <section>
      <h2 class="rowlabel">Accesos</h2>
      <div class="row quick" id="quick">
        <button class="tile" data-app="HDMI 1">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5h18l-2.4 3.4a2 2 0 0 1-1.6.9H7a2 2 0 0 1-1.6-.9L3 9.5z"/><path d="M7 9.5V8a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v1.5"/><path d="M9.5 17h5"/></svg>
          <span class="qlabel">HDMI 1</span>
        </button>
        <button class="tile" data-app="HDMI 2">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5h18l-2.4 3.4a2 2 0 0 1-1.6.9H7a2 2 0 0 1-1.6-.9L3 9.5z"/><path d="M7 9.5V8a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v1.5"/><path d="M9.5 17h5"/></svg>
          <span class="qlabel">HDMI 2</span>
        </button>
        <button class="tile" data-app="USB">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="9" width="10" height="12" rx="2"/><path d="M9 9V5.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V9"/><path d="M10.5 13.5h.01M13.5 13.5h.01"/></svg>
          <span class="qlabel">USB</span>
        </button>
        <button class="tile" data-app="YouTube">
          <svg class="ic yt" viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.5a3 3 0 0 0-2.1-2.1C19 4.9 12 4.9 12 4.9s-7 0-8.9.5A3 3 0 0 0 1 7.5 31 31 0 0 0 .6 12 31 31 0 0 0 1 16.5a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5A3 3 0 0 0 23 16.5 31 31 0 0 0 23.4 12 31 31 0 0 0 23 7.5z"/><path d="M9.8 15.3V8.7l5.7 3.3z" fill="#06070b"/></svg>
          <span class="qlabel">YouTube</span>
        </button>
        <button class="tile" data-app="Buscar">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <span class="qlabel">Buscar</span>
        </button>
        <button class="tile" data-app="Ajustes">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 0 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 4.6 15H4.5a2 2 0 0 1 0-4h.1A1.6 1.6 0 0 0 6.3 8.3l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 11 4.6V4.5a2 2 0 0 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 .9 1.5h.1a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5.9z"/></svg>
          <span class="qlabel">Ajustes</span>
        </button>
        <button class="tile dim" data-app="TV / Antena (coaxial)">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20l7-9 7 9"/><path d="M12 11V4.5"/><path d="M8.6 6.6a5 5 0 0 1 6.8 0"/><path d="M6.4 4.4a8 8 0 0 1 11.2 0"/></svg>
          <span class="qlabel">Antena</span>
        </button>
      </div>
    </section>
  </main>

  <footer class="hint">
    <span><kbd>◂ ▸ ▴ ▾</kbd> moverte</span>
    <span><kbd>OK</kbd> abrir</span>
    <span class="tag">Prototipo · launcher</span>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
  "use strict";

  // live clock + greeting + date
  var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  var DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  function pad(n){return (n<10?"0":"")+n;}
  function tick(){
    var d=new Date();
    var h=d.getHours();
    document.getElementById("clock").textContent=pad(h)+":"+pad(d.getMinutes());
    var g = h<6?"Buenas noches" : h<12?"Buenos días" : h<19?"Buenas tardes" : "Buenas noches";
    document.getElementById("greet").innerHTML = g+', <span class="name">Fredi</span>';
    document.getElementById("dateline").textContent = DIAS[d.getDay()]+" "+d.getDate()+" de "+MESES[d.getMonth()];
  }
  tick(); setInterval(tick, 10000);

  // toast on "launch"
  var toast=document.getElementById("toast"), tid;
  function launch(name){
    toast.hidden=false; toast.textContent="Abriendo "+name+" …";
    requestAnimationFrame(function(){ toast.classList.add("show"); });
    clearTimeout(tid);
    tid=setTimeout(function(){ toast.classList.remove("show");
      setTimeout(function(){ toast.hidden=true; }, 220); }, 1400);
    // En la TV real, aquí se llamaría al puente JS de VIDAA para lanzar la app.
  }

  // spatial D-pad navigation across all tiles
  var tiles=[].slice.call(document.querySelectorAll(".tile"));
  function setFocus(el){
    tiles.forEach(function(t){ t.classList.remove("is-focus"); });
    if(el){ el.classList.add("is-focus"); el.focus(); }
  }
  function center(el){var r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};}
  function move(dir){
    var cur=document.querySelector(".tile.is-focus")||tiles[0];
    var c=center(cur), best=null, bestScore=Infinity;
    tiles.forEach(function(t){
      if(t===cur) return;
      var p=center(t), dx=p.x-c.x, dy=p.y-c.y;
      var ok = dir==="left"?dx<-4 : dir==="right"?dx>4 : dir==="up"?dy<-4 : dy>4;
      if(!ok) return;
      var along = (dir==="left"||dir==="right")?Math.abs(dx):Math.abs(dy);
      var across= (dir==="left"||dir==="right")?Math.abs(dy):Math.abs(dx);
      var score=along+across*2;
      if(score<bestScore){bestScore=score;best=t;}
    });
    if(best) setFocus(best);
  }
  document.addEventListener("keydown",function(e){
    switch(e.key){
      case "ArrowLeft": move("left"); e.preventDefault(); break;
      case "ArrowRight": move("right"); e.preventDefault(); break;
      case "ArrowUp": move("up"); e.preventDefault(); break;
      case "ArrowDown": move("down"); e.preventDefault(); break;
      case "Enter": case " ":
        var cur=document.querySelector(".tile.is-focus");
        if(cur){ launch(cur.dataset.app); e.preventDefault(); }
        break;
    }
  });
  tiles.forEach(function(t){
    t.addEventListener("mouseenter",function(){ setFocus(t); });
    t.addEventListener("click",function(){ setFocus(t); launch(t.dataset.app); });
  });
  setFocus(tiles[0]);
})();
</script>

</body>
</html>
